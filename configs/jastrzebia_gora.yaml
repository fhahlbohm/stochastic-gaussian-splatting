GLOBAL:
    LOG_LEVEL: 2
    GPU_INDICES:
    - 0
    RANDOM_SEED: 0
    ANOMALY_DETECTION: false
    FILTER_WARNINGS: true
    METHOD_TYPE: StochasticGS
    DATASET_TYPE: Empty
MODEL:
    PLY_PATH: /TODO/20K-Photo-103Mspats-4x2KM-Andrii_Shramko_Poland-JG.ply  # 106,447,647 Gaussians, SH0 (available at https://drive.google.com/drive/folders/1YYNLzeO8YIWigVqQkkc7NvgcKOK0bU0A)
    CAMERA_PATH: /TODO/Jastrzębia_Góra_camera_path.json  # 600 frames (available at https://github.com/JorisAR/gaussian-point-splatting/blob/main/assets/cameras/Jastrz%C4%99bia_G%C3%B3ra_camera_path.json)
RENDERER:
    PROPER_ANTIALIASING: false
    USE_GPS: false
    HYBRID_SCHEDULING: false
    SUPERSAMPLING_FACTOR: 1
    SAMPLES_PER_PIXEL: 1
    DISABLE_PROGRESSIVE_RENDERING: false
    SPATIAL_REUSE: false
    TEMPORAL_REUSE: false
TRAINING:
    LOAD_CHECKPOINT: null
    MODEL_NAME: jastrzebia_gora
    NUM_ITERATIONS: 0
    RUN_VALIDATION: false
    DATA:
        PRELOADING_LEVEL: 0
        FIELDS: []
        PRECOMPUTE_RAYS: false
        RAYS_TO_DEVICE: false
    BACKUP:
        FINAL_CHECKPOINT: false
        RENDER_TESTSET: false
        RENDER_TRAINSET: false
        RENDER_VALSET: false
        INTERMEDIATE_RENDERINGS: false
        VISUALIZE_ERRORS: false
        INTERVAL: -1
        TRAINING_STATE: false
    TIMING:
        ACTIVATE: false
        INCLUDE_DATALOADING_IN_TOTAL: false
        INCLUDE_PRETRAINING_IN_TOTAL: false
        INCLUDE_POSTTRAINING_IN_TOTAL: false
    WANDB:
        ACTIVATE: false
        ENTITY: null
        PROJECT: nerficg
        LOG_IMAGES: true
        INDEX_VALIDATION: -1
        INDEX_TRAINING: -1
        INTERVAL: 1000
        SWEEP_MODE:
            ACTIVE: false
            START_ITERATION: 999
            ITERATION_STRIDE: 1000
            NUM_IMAGES: -1
    WRITE_VRAM_STATS: false
    GUI:
        ACTIVATE: true
        RENDER_INTERVAL: 1
        GUI_STATUS_ENABLED: true
        GUI_STATUS_INTERVAL: 20
        SKIP_GUI_SETUP: true  # setting to false for one launch allows disabling vsync persistently
        FPS_ROLLING_AVERAGE_SIZE: 100
        MAX_RENDERS_BETWEEN_GUI_UPDATES: 2
DATASET:
    PATH: ''
    IMAGE_SCALE_FACTOR: null
    NORMALIZE_CUBE: null
    NORMALIZE_RECENTER: false
    BACKGROUND_COLOR:
    - 0.0
    - 0.0
    - 0.0
    NEAR_PLANE: 0.2
    FAR_PLANE: 10000.0
    DEFAULT_WIDTH: 1920
    DEFAULT_HEIGHT: 1080
    VERTICAL_FOV: 45.0
